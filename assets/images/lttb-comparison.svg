<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #08090d; }
      .box { fill: #0d0e15; stroke: #1f2430; stroke-width: 1.5; rx: 6px; }
      .grid { stroke: #161922; stroke-width: 1; stroke-dasharray: 2 2; }
      .line-raw { fill: none; stroke: #e2e8f0; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; }
      .line-lttb { fill: none; stroke: #f8fafc; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
      .label-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #e2e8f0; }
      .lttb-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: bold; fill: #ff6b6b; }
      .sub-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #94a3b8; }
      .target-outer { fill: none; stroke: #ff7e5f; stroke-width: 1.5; opacity: 0.8; }
      .target-inner { fill: #ff7e5f; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="620" height="310" class="bg" />

  <!-- Left Box: Raw 400 Points -->
  <g transform="translate(30, 20)">
    <rect width="250" height="230" class="box" />
    
    <!-- Grid lines -->
    <line x1="0" y1="57.5" x2="250" y2="57.5" class="grid" />
    <line x1="0" y1="115" x2="250" y2="115" class="grid" />
    <line x1="0" y1="172.5" x2="250" y2="172.5" class="grid" />
    <line x1="62.5" y1="0" x2="62.5" y2="230" class="grid" />
    <line x1="125" y1="0" x2="125" y2="230" class="grid" />
    <line x1="187.5" y1="0" x2="187.5" y2="230" class="grid" />

    <!-- Noisy Line Path (400 points simulation) -->
    <path class="line-raw" d="
      M 10 180 L 14 130 L 18 190 L 22 110 L 26 160 L 30 90 L 34 140 L 38 70 L 42 150 L 46 100 L 50 180 L 54 120 
      L 58 200 L 62 140 L 66 170 L 70 80 L 74 130 L 78 60 L 82 150 L 86 110 L 90 190 L 94 130 L 98 175 L 102 95 
      L 106 145 L 110 50 L 114 120 L 118 70 L 122 160 L 126 105 L 130 185 L 134 135 L 138 165 L 142 85 L 146 140 
      L 150 45 L 154 110 L 158 65 L 162 155 L 166 90 L 170 170 L 174 125 L 178 195 L 182 135 L 186 160 L 190 75 
      L 194 130 L 198 55 L 202 140 L 206 100 L 210 180 L 214 120 L 218 165 L 222 85 L 226 150 L 230 95 L 234 170 L 240 110
    " />

    <!-- Highlight Target Circle -->
    <circle cx="150" cy="45" r="10" class="target-outer" />
    <circle cx="150" cy="45" r="3" class="target-inner" />

    <!-- Label -->
    <text x="125" y="260" class="label-text" text-anchor="middle">400 Points</text>
  </g>

  <!-- Right Box: LTTB Downsampled to 40 Points -->
  <g transform="translate(340, 20)">
    <rect width="250" height="230" class="box" />
    
    <!-- Grid lines -->
    <line x1="0" y1="57.5" x2="250" y2="57.5" class="grid" />
    <line x1="0" y1="115" x2="250" y2="115" class="grid" />
    <line x1="0" y1="172.5" x2="250" y2="172.5" class="grid" />
    <line x1="62.5" y1="0" x2="62.5" y2="230" class="grid" />
    <line x1="125" y1="0" x2="125" y2="230" class="grid" />
    <line x1="187.5" y1="0" x2="187.5" y2="230" class="grid" />

    <!-- Downsampled Line Path (40 points with LTTB preserving macro peaks/troughs) -->
    <path class="line-lttb" d="
      M 10 180 L 22 110 L 30 160 L 38 70 L 50 180 L 58 200 L 70 80 L 78 60 L 90 190 
      L 102 95 L 110 50 L 122 160 L 138 165 L 150 45 L 162 155 L 170 170 L 178 195 
      L 190 75 L 198 55 L 210 180 L 222 85 L 234 170 L 240 110
    " />

    <!-- Highlight Target Circle -->
    <circle cx="150" cy="45" r="10" class="target-outer" />
    <circle cx="150" cy="45" r="3" class="target-inner" />

    <!-- Annotation Callout -->
    <path d="M 195 95 Q 175 75 162 55" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2" />
    <g transform="translate(145, 115) rotate(-12)">
      <text x="0" y="0" class="sub-text" font-style="italic">** notice the shape of</text>
      <text x="0" y="14" class="sub-text" font-style="italic">data is maintained</text>
    </g>

    <!-- Labels -->
    <text x="125" y="258" class="lttb-text" text-anchor="middle">Downsampled to 40 Points</text>
    <text x="125" y="274" class="lttb-text" text-anchor="middle">with LTTB</text>
  </g>
</svg>
