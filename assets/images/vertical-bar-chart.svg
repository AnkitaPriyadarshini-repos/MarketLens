<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0d0d11" rx="16"/>
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#1e2330" stroke-width="2" rx="14"/>

  <!-- Y Axis Grid & Labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="14" fill="#64748b" text-anchor="end">
    <line x1="100" y1="80" x2="740" y2="80" stroke="rgba(51, 65, 85, 0.3)" stroke-width="1"/>
    <text x="85" y="85">410</text>

    <line x1="100" y1="166" x2="740" y2="166" stroke="rgba(51, 65, 85, 0.3)" stroke-width="1"/>
    <text x="85" y="171">273</text>

    <line x1="100" y1="253" x2="740" y2="253" stroke="rgba(51, 65, 85, 0.3)" stroke-width="1"/>
    <text x="85" y="258">137</text>

    <line x1="100" y1="340" x2="740" y2="340" stroke="rgba(51, 65, 85, 0.5)" stroke-width="1.5"/>
    <text x="85" y="345">0</text>
  </g>

  <!-- X Axis Labels -->
  <g font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    <text x="145" y="375">Mon</text>
    <text x="245" y="375">Tue</text>
    <text x="345" y="375">Wed</text>
    <text x="445" y="375">Thu</text>
    <text x="545" y="375">Fri</text>
    <text x="645" y="375">Sun</text>
  </g>

  <!-- Bars -->
  <!-- Mon: 120 -->
  <rect x="120" y="264" width="50" height="76" rx="8" ry="8" fill="#9672f8"/>
  <!-- Tue: 180 -->
  <rect x="220" y="226" width="50" height="114" rx="8" ry="8" fill="#9672f8"/>
  <!-- Wed: 134 -->
  <rect x="320" y="255" width="50" height="85" rx="8" ry="8" fill="#9672f8"/>
  <!-- Thu: 410 -->
  <rect x="420" y="80" width="50" height="260" rx="8" ry="8" fill="#9672f8"/>
  <!-- Fri: 275 (ACTIVE HIGHLIGHT) -->
  <rect x="520" y="165" width="50" height="175" rx="8" ry="8" fill="#ff7e5f"/>
  <!-- Sun: 380 -->
  <rect x="620" y="99" width="50" height="241" rx="8" ry="8" fill="#9672f8"/>

  <!-- Active Bar Floating Pill Badge (275) -->
  <g transform="translate(515, 120)">
    <rect x="0" y="0" width="60" height="32" rx="8" fill="#0f172a" stroke="#ff7e5f" stroke-width="2"/>
    <text x="30" y="21" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">275</text>
  </g>
