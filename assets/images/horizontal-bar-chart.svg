  <rect x="220" y="186" width="385" height="38" rx="8" ry="8" fill="#f59e0b"/>

  <!-- 4. Rust (52) -->
  <text x="200" y="268" font-family="'Inter', sans-serif" font-size="14" fill="#475569" text-anchor="end">Rust</text>
  <rect x="220" y="244" width="280" height="38" rx="8" ry="8" fill="#f59e0b"/>

