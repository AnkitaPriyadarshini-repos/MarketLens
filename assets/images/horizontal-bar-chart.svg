<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#f8fafc" rx="16"/>
  <rect x="2" y="2" width="796" height="496" fill="none" stroke="#e2e8f0" stroke-width="2" rx="14"/>

  <!-- Top X Axis Ticks & Gridlines -->
  <g font-family="'JetBrains Mono', monospace" font-size="14" fill="#64748b" text-anchor="middle">
    <line x1="220" y1="50" x2="220" y2="460" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="220" y="40">0</text>

    <line x1="380" y1="50" x2="380" y2="460" stroke="#e2e8f0" stroke-width="1.5"/>
