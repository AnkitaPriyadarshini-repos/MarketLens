    <line x1="545" y1="50" x2="545" y2="460" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="545" y="40">61</text>

    <line x1="710" y1="50" x2="710" y2="460" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="710" y="40">91</text>
  </g>

  <!-- Left Category Labels & Horizontal Bars -->
  <!-- 1. Python (91) - Bold -->
  <text x="200" y="94" font-family="'Inter', sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="end">Python</text>
  <rect x="220" y="70" width="490" height="38" rx="8" ry="8" fill="#f59e0b"/>

  <!-- 2. JavaScript (82) -->
